name: Version main
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    uses: ./.github/workflows/test.yml
  version:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - name: Record the tested revision on main
        shell: bash
        run: |
          set -euo pipefail
          main_head() { git ls-remote --exit-code origin refs/heads/main | cut -f1; }
          remote_sha=$(main_head)
          if [[ "$remote_sha" != "$GITHUB_SHA" ]]; then
            echo "main has already advanced to $remote_sha"
            exit 0
          fi

          read -r previous _ < RELEASE
          version="${previous%.*}.$GITHUB_RUN_NUMBER"
          printf '%s %s\n' "$version" "$GITHUB_SHA" > RELEASE
          bundle lock --local
          bundle check
          gem build sukashi.gemspec --output "$RUNNER_TEMP/sukashi.gem"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RELEASE Gemfile.lock
          git commit -m "Release sukashi $version from $GITHUB_SHA"
          if ! git push origin HEAD:refs/heads/main; then
            remote_sha=$(main_head)
            if [[ "$remote_sha" == "$GITHUB_SHA" ]]; then exit 1; fi
            echo "A newer push advanced main to $remote_sha"
          fi
      - name: Install from GitHub in a fresh bundle
        shell: bash
        run: |
          cd "$(mktemp -d)"
          export BUNDLE_GEMFILE="$PWD/Gemfile"
          cat > Gemfile <<'GEMFILE'
          source "https://rubygems.org"
          gem "sukashi", github: ENV.fetch("GITHUB_REPOSITORY")
          GEMFILE
          bundle install
          bundle exec sukashi --version
          bundle exec ruby -rsukashi -e '
            spec = Gem.loaded_specs.fetch("sukashi")
            abort "gem version mismatch" unless spec.version.to_s == Sukashi::VERSION
            abort "source revision mismatch" unless spec.metadata.fetch("source_revision") == Sukashi::SOURCE_REVISION
          '
